name: Windows YouTube VPS

on:
  workflow_dispatch:
    inputs:
      tool_url:
        description: 'URL Trang Web Tool làm video'
        required: true
        type: string
      cookies_b64:
        description: 'Base64 YouTube Cookies JSON'
        required: true
        type: string

permissions:
  contents: write

# Tự động hủy VPS cũ đang chạy nếu bạn bấm bật VPS mới
concurrency:
  group: windows-youtube-vps-group
  cancel-in-progress: true

jobs:
  youtube_vps:
    runs-on: windows-latest
    timeout-minutes: 300

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt thư viện điều khiển trình duyệt & Cloudflare Tunnel
        run: |
          pip install flask playwright requests
          playwright install chromium
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

      - name: Khởi chạy Trình duyệt VPS & Gửi màn hình về Localhost
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          TOOL_URL: ${{ inputs.tool_url }}
          COOKIES_B64: ${{ inputs.cookies_b64 }}
        run: |
          # 1. Khởi chạy trình duyệt và máy chủ hình ảnh ở cổng 8080
          Start-Process python -ArgumentList "cloud_worker.py" -RedirectStandardOutput "worker_out.log" -RedirectStandardError "worker_err.log" -NoNewWindow

          # 2. Chờ máy chủ Flask (cổng 8080) trên VPS mở thành công
          for ($w = 0; $w -lt 20; $w++) {
            Start-Sleep -Seconds 2
            try {
              $res = Invoke-WebRequest -Uri "http://127.0.0.1:8080/status" -UseBasicParsing -TimeoutSec 2
              if ($res.StatusCode -eq 200) {
                Write-Host "Máy chủ cổng 8080 đã sẵn sàng!"
                break
              }
            } catch {}
          }

          # 3. Mở đường hầm Cloudflare kết nối vào cổng 8080
          Start-Process .\cloudflared.exe -ArgumentList "tunnel --url http://127.0.0.1:8080 --no-autoupdate --protocol http2" -RedirectStandardError "tunnel.log" -NoNewWindow

          # 4. Chờ và lấy đường link trycloudflare.com mới nhất
          $url = ""
          for ($i = 0; $i -lt 35; $i++) {
            Start-Sleep -Seconds 2
            if (Test-Path "tunnel.log") {
              $content = Get-Content "tunnel.log" -Raw
              if ($content -match "https://[a-zA-Z0-9-]+\.trycloudflare\.com") {
                $url = $matches[0]
                break
              }
            }
          }

          if ($url -eq "") {
            Write-Error "Không lấy được link Cloudflare Tunnel!"
            if (Test-Path "worker_err.log") { Get-Content "worker_err.log" }
            exit 1
          }

          Write-Host "=========================================="
          Write-Host "Link điều khiển trực tiếp VPS: $url"
          Write-Host "=========================================="

          # 5. Lưu link mới vào vps_live.json (chuẩn UTF-8 không BOM) và đẩy lên GitHub
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

          $epoch = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $json = @{ url = $url; timestamp = $epoch } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$PWD\vps_live.json", $json)

          git add vps_live.json
          git commit -m "Update live VPS stream URL ($epoch)"
          git push origin HEAD:main

          # 6. Giữ VPS hoạt động liên tục (4 tiếng) và in log nếu có lỗi
          for ($m = 0; $m -lt 240; $m++) {
            Start-Sleep -Seconds 60
            if (Test-Path "worker_err.log") {
              Get-Content "worker_err.log" -Tail 5
            }
          }
